name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engram:
    name: Node ${{ matrix.node }} · typecheck, tests, benchmark gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '22', '24', '26']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Benchmark gate and determinism
        run: npm run bench
        env:
          MEM_GATE: '1'
          MEM_DETERMINISM_CHECK: '1'
